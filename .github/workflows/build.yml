name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          ls -la
          test -f voltex-project.zip || { echo "::error::voltex-project.zip is not in the repo root. Upload it."; exit 1; }
          mkdir -p proj
          unzip -q -o voltex-project.zip -d proj
          ls proj proj/app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Prepare signing key
        working-directory: proj
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing."
            exit 1
          fi
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=')
          echo "clean length: ${#CLEAN} (expected 3576)"
          printf '%s' "$CLEAN" | base64 -d > release.jks || { echo "::error::KEYSTORE_B64 is not valid base64."; exit 1; }
          PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n')
          ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n')
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$PASS" "$ALIAS" "$PASS" > keystore.properties
      - name: Build release APK
        working-directory: proj
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee logs/build-log.txt
      - name: Collect errors
        if: failure()
        working-directory: proj
        shell: bash
        run: |
          mkdir -p logs
          touch logs/build-log.txt
          grep -E "^e: |error:|What went wrong|Execution failed|FAILED|Unresolved|AAPT" -A4 logs/build-log.txt | head -150 > logs/ERRORS.txt || true
          cat logs/ERRORS.txt
      - name: Build lite APK (smaller)
        working-directory: proj
        continue-on-error: true
        run: gradle :app:assembleLite --no-daemon
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: proj/logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: VOLTEX-apk
          path: |
            proj/app/build/outputs/apk/release/app-release.apk
            proj/app/build/outputs/apk/lite/app-lite.apk
